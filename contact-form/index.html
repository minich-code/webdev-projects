<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Collection Form</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="main-container">
        <div class="form-box">
            <h2>Join our Waiting List</h2>
            <p>Enter your details below to be added to our database</p>

            <form id="sheet-form">
                <div class="form-group">
                    <label for="fullName">Full Name</label>
                    <input type="text" id="fullName" name="name" placeholder="Jane Doe" required>
                </div>

                <div class="form-group">
                    <label for="emailAddress">Email Address</label>
                    <input type="email" id="emailAddress" name="email" placeholder="jane@example.com" required>
                </div>

                <div class="form-group">
                    <label for="phoneNumber">Phone Number</label>
                    <input type="tel" id="phoneNumber" name="phone" placeholder="+1 234 567 890" required>
                </div>

                <button type="submit" id="submitBtn">Submit Details</button>
                <p id="msg"></p>
            </form>
        </div>
    </div>

    <!-- Popup for confirmation -->
    <div id="popup" class="popup">
        <p>Details submitted successfully!</p>
    </div>

    <script src="script.js"></script>
</body>
</html>
