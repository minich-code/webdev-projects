<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Weather Application</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <div class="card">
    <div class="search">
      <input class="search-input" type="text" placeholder="Enter city name..." spellcheck="false" />
      <button><img src="images/search-icon.svg" alt="search" /></button>
    </div>

    <div class="error">
      <p>Invalid city name</p>
    </div>

    <div class="weather">
      <img class="weather-icon" src="images/rain.png" alt="weather icon" />
      <h1 class="temp">22°C</h1>
      <h2 class="weather-city">Nairobi</h2>

      <div class="details">
        <div class="col">
          <img class="humidity-icon" src="images/humidity.png" alt="humidity icon" />
          <div>
            <p class="humidity">56%</p>
            <p>Humidity</p>
          </div>
        </div>

        <div class="col">
          <img class="wind-icon" src="images/wind.png" alt="wind icon" />
          <div>
            <p class="wind">12km/h</p>
            <p>Wind</p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
